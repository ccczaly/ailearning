<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="upstream-source" content="https://xueai.miyang.cn/slides/7-4.html">
<title>Agent Harness：有无运行设施的对照 · LearnAI</title>
<link rel="stylesheet" href="../shared/lesson.css">
<style>

:root{--green:var(--success);--orange:var(--amber);--red:var(--danger);--muted:var(--sub);--surface:var(--card);--surface2:rgba(0,0,0,.04)}

.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.left-col,.right-col{display:flex;flex-direction:column;gap:10px;min-width:0}

/* 模式切换 */
.mode-row{display:flex;gap:8px}
.mode-btn{flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;text-align:center;font-family:inherit;transition:all .15s;min-height:44px}
.mode-btn h4{font-size:15px;font-weight:700;margin-bottom:2px}
.mode-btn p{font-size:12px;color:var(--sub)}
.mode-btn.bad.active{border-color:var(--red);background:rgba(220,38,38,.04)}.mode-btn.bad.active h4{color:var(--red)}
.mode-btn.good.active{border-color:var(--green);background:rgba(22,163,74,.04)}.mode-btn.good.active h4{color:var(--green)}

/* 控制 */
.ctrl{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl-label{font-size:14px;color:var(--muted);font-weight:600}
.btn-reset{padding:8px 12px;border-radius:7px;background:var(--surface2);color:var(--sub);font-size:13px;font-weight:600;border:1px solid var(--border);cursor:pointer;font-family:inherit;min-height:38px}

/* 运行日志 */
.log-panel{background:var(--card);border:1.5px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.log-head{padding:9px 12px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.02);font-size:14px;font-weight:700;color:var(--muted)}
.log-body{padding:10px;display:flex;flex-direction:column;gap:5px;min-height:120px}
.log-entry{padding:6px 10px;border-radius:7px;font-size:13px;line-height:1.5;display:flex;align-items:flex-start;gap:6px;opacity:0;transform:translateY(4px);transition:all .3s}
.log-entry.show{opacity:1;transform:translateY(0)}
.log-icon{flex-shrink:0;font-size:14px;width:20px;text-align:center}
.log-text{flex:1;color:var(--text)}
.log-entry.think{background:rgba(124,58,237,.04)}.log-entry.think .log-icon{color:var(--purple)}
.log-entry.tool{background:rgba(8,145,178,.04)}.log-entry.tool .log-icon{color:var(--cyan)}
.log-entry.ok{background:rgba(22,163,74,.04)}.log-entry.ok .log-icon{color:var(--green)}
.log-entry.err{background:rgba(220,38,38,.04)}.log-entry.err .log-icon{color:var(--red)}
.log-entry.warn{background:rgba(217,119,6,.04)}.log-entry.warn .log-icon{color:var(--orange)}
.log-entry.fix{background:rgba(22,163,74,.04);border:1px solid rgba(22,163,74,.12)}.log-entry.fix .log-icon{color:var(--green)}

/* 统计 */
.stat-row{display:flex;gap:6px}
.stat{flex:1;border-radius:8px;padding:8px;text-align:center}
.stat-n{font-size:20px;font-weight:800}
.stat-l{font-size:11px;font-weight:700;margin-top:1px}
.stat.bad{background:rgba(220,38,38,.06);color:var(--red)}.stat.bad .stat-l{color:var(--red)}
.stat.good{background:rgba(22,163,74,.06);color:var(--green)}.stat.good .stat-l{color:var(--green)}
.stat.neutral{background:var(--surface2);color:var(--text)}.stat.neutral .stat-l{color:var(--muted)}

/* 右栏：5大能力 */
.cap-list{display:flex;flex-direction:column;gap:5px}
.cap-item{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:all .15s;font-family:inherit;text-align:left;width:100%;min-height:44px}
.cap-item:hover{background:rgba(217,119,6,.02)}
.cap-item.active{border-color:var(--orange);background:rgba(217,119,6,.04)}
.cap-num{width:22px;height:22px;border-radius:6px;background:rgba(217,119,6,.1);color:var(--orange);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cap-item h5{font-size:14px;font-weight:700;color:var(--text)}
.cap-item p{font-size:12px;color:var(--sub);line-height:1.35}

.detail-card{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:14px}
.detail-card h5{font-size:15px;font-weight:700;color:var(--orange);margin-bottom:6px}
.detail-card p{font-size:14px;color:var(--sub);line-height:1.65;margin-bottom:6px}
.detail-card p:last-child{margin-bottom:0}
.detail-card b{color:var(--text)}
.detail-card code{font-family:'Cascadia Code','Fira Code',monospace;font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:3px;color:var(--text)}

.ratio-box{background:rgba(217,119,6,.06);border:1px solid rgba(217,119,6,.18);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--text);line-height:1.6;text-align:center}
.ratio-box b{color:var(--orange)}

@media (max-width:768px){
  .demo-grid{grid-template-columns:1fr}
}


/* Adapted to a course reading column; original interaction layout is preserved on wide screens. */
html,body{margin:0;min-width:0;opacity:1}body{overflow-wrap:anywhere}.lesson{max-width:none;margin:0;padding:16px;box-sizing:border-box}.reference-demo-note{margin:16px;padding:12px;border:1px solid var(--border);border-radius:10px;color:var(--sub);font-size:13px;line-height:1.7}button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.pipeline{overflow-x:auto;padding-bottom:8px}.flow-row{flex-wrap:wrap}.table-wrap{overflow-x:auto}@media(max-width:800px){.demo-grid,.body-grid,.main-body,.monitor,.scaf-grid,.cap-grid,.agent-grid{grid-template-columns:1fr!important}.sim-body,.event-area{max-height:420px;overflow-y:auto}.mode-tabs,.mode-row{flex-wrap:wrap}.stats-area{grid-template-columns:repeat(2,minmax(0,1fr))!important}.org{overflow-x:auto}.confirm-card{max-width:calc(100vw - 32px)}}
</style>
<script src="../shared/lesson.js"></script>
<script src="../shared/embed.js"></script>
</head>
<body>
<article class="lesson wide">
    <div class="demo-grid   " id="scafDemo">
    
    <div class="left-col">
      <div class="mode-row">
        <button class="mode-btn bad active" id="modeBad" onclick="setMode('bad')"><h4>❌ 没有脚手架</h4><p>裸跑 Agent，看看会发生什么</p></button>
        <button class="mode-btn good" id="modeGood" onclick="setMode('good')"><h4>✅ 有脚手架</h4><p>加上 5 层防护后的效果</p></button>
      </div>

      <div class="ctrl">
        <span class="ctrl-label" id="ctrlLabel">任务：帮用户查机票 + 订酒店</span>
        <button class="btn-reset" onclick="replaySim()">↺ 重播</button>
      </div>

      <div class="log-panel">
        <div class="log-head" id="logHead">Agent 运行日志</div>
        <div class="log-body" id="logBody"></div>
      </div>

      <div class="stat-row" id="statRow"></div>
    </div>

    
    <div class="right-col">
      <div style="font-size:14px;font-weight:700;color:var(--muted)">生产级脚手架 5 大能力（点击查看详解）</div>
      <div class="cap-list">
        <button class="cap-item active" onclick="showCap(this,0)"><div class="cap-num">1</div><div><h5>超时与重试</h5><p>工具调用设 timeout + 指数退避重试</p></div></button>
        <button class="cap-item" onclick="showCap(this,1)"><div class="cap-num">2</div><div><h5>最大步数限制</h5><p>max_iterations 防止死循环</p></div></button>
        <button class="cap-item" onclick="showCap(this,2)"><div class="cap-num">3</div><div><h5>输入输出校验</h5><p>JSON Schema 拦截非法参数</p></div></button>
        <button class="cap-item" onclick="showCap(this,3)"><div class="cap-num">4</div><div><h5>状态机 + 回滚</h5><p>检查点恢复，失败不从头来</p></div></button>
        <button class="cap-item" onclick="showCap(this,4)"><div class="cap-num">5</div><div><h5>观测与日志</h5><p>全链路记录，生产问题靠日志</p></div></button>
      </div>
      <div class="detail-card" id="detailCard"></div>
      <div class="ratio-box">
        Agent 工程 = <b>80% 脚手架 + 20% 模型</b><br>
        大多数 Agent 项目失败，败在错误处理不够健壮。模型够不够聪明反倒是次要的。
      </div>
    </div>
  </div>
</article>
<p class="reference-demo-note">教学预设：所有对话、动作、执行结果、次数、Token、时间和费用均为示例数据，不会调用真实模型、执行命令或产生预订/发布。技能说明与风险分类不能替代程序权限检查。</p>
<noscript>请启用 JavaScript 查看交互演示。</noscript>
<script>

const BAD_STEPS=[
  {cls:'think',icon:'🧠',text:'思考：用户要查机票和订酒店，先查机票…'},
  {cls:'tool',icon:'🔧',text:'调用 search_flights("北京→上海", "2026-04-15")'},
  {cls:'err',icon:'❌',text:'API 超时…没有设超时机制，一直等待中…'},
  {cls:'err',icon:'⏳',text:'等了 45 秒…还在等…用户以为 AI 卡死了'},
  {cls:'think',icon:'🧠',text:'终于超时了。再试一次…'},
  {cls:'tool',icon:'🔧',text:'调用 search_flights("北京→上海", "2026-04-15")'},
  {cls:'ok',icon:'✅',text:'拿到机票数据了：3 个航班可选。'},
  {cls:'think',icon:'🧠',text:'现在订酒店。用 book_hotel 工具…'},
  {cls:'tool',icon:'🔧',text:'调用 book_hotel("上海", checkin="明天") — 参数格式错误！'},
  {cls:'err',icon:'💥',text:'API 报错 400：date 格式必须是 YYYY-MM-DD，但传了「明天」'},
  {cls:'think',icon:'🧠',text:'再试一次…'},
  {cls:'tool',icon:'🔧',text:'调用 book_hotel("上海", checkin="明天")  — 又传了一样的参数！'},
  {cls:'err',icon:'💥',text:'又报错 400…模型没学会纠正，进入循环…'},
  {cls:'err',icon:'🔄',text:'第 3 次调用…第 4 次…第 5 次…全是同一个错误'},
  {cls:'err',icon:'💸',text:'循环了 15 次，消耗了 50K Token，用户还是没拿到酒店信息'},
  {cls:'err',icon:'☠️',text:'最终崩溃：无结果返回。用户体验极差。'},
];

const GOOD_STEPS=[
  {cls:'think',icon:'🧠',text:'思考：用户要查机票和订酒店，先查机票…'},
  {cls:'tool',icon:'🔧',text:'调用 search_flights("北京→上海", "2026-04-15")  [timeout=10s]'},
  {cls:'warn',icon:'⏱️',text:'脚手架：API 响应超时 (10s)，自动重试 1/3 …'},
  {cls:'ok',icon:'✅',text:'重试成功！拿到 3 个航班。[耗时 3.2s]'},
  {cls:'think',icon:'🧠',text:'现在订酒店。'},
  {cls:'tool',icon:'🔧',text:'调用 book_hotel("上海", checkin="明天")'},
  {cls:'fix',icon:'🛡️',text:'脚手架：参数校验失败 → date 格式必须是 YYYY-MM-DD → 返回格式错误给模型'},
  {cls:'think',icon:'🧠',text:'收到校验反馈，纠正参数格式…'},
  {cls:'tool',icon:'🔧',text:'调用 book_hotel("上海", checkin="2026-04-15")  ✓ 参数合法'},
  {cls:'ok',icon:'✅',text:'模拟：酒店预订成功！上海浦东希尔顿，¥580/晚。'},
  {cls:'ok',icon:'📊',text:'脚手架日志：总计 5 次工具调用，8K Token，耗时 12s，全程可追溯。'},
  {cls:'ok',icon:'🎉',text:'任务完成：机票 + 酒店信息已整合返回给用户。'},
];

let curMode='bad',curStep=0,playTimer=null,viewed=false;

function setMode(m){curMode=m;
  document.getElementById('modeBad').className='mode-btn bad'+(m==='bad'?' active':'');
  document.getElementById('modeGood').className='mode-btn good'+(m==='good'?' active':'');
  resetSim();
  if(viewed)startPlay();
}

function resetSim(){
  if(playTimer){clearTimeout(playTimer);playTimer=null;}
  curStep=0;
  const steps=curMode==='bad'?BAD_STEPS:GOOD_STEPS;
  document.getElementById('logBody').innerHTML=steps.map((s,i)=>
    `<div class="log-entry ${s.cls}" id="le${i}"><span class="log-icon">${s.icon}</span><span class="log-text">${s.text}</span></div>`
  ).join('');
  document.getElementById('logHead').textContent=curMode==='bad'?'Agent 运行日志（无脚手架）':'Agent 运行日志（有脚手架）';
  document.getElementById('ctrlLabel').textContent='任务：帮用户查机票 + 订酒店';
  document.getElementById('statRow').innerHTML='';
}

function replaySim(){
  resetSim();
  startPlay();
}

function playNext(){
  const steps=curMode==='bad'?BAD_STEPS:GOOD_STEPS;
  if(curStep>=steps.length)return;
  const el=document.getElementById('le'+curStep);
  el.classList.add('show');
  curStep++;
  document.getElementById('ctrlLabel').textContent=`第 ${curStep} / ${steps.length} 步`;
  if(curStep>=steps.length){
    playTimer=null;
    showStats();
  }else{
    playTimer=setTimeout(playNext,700);
  }
}

function startPlay(){
  if(playTimer)clearTimeout(playTimer);
  playTimer=setTimeout(playNext,300);
}

function showStats(){
  const isBad=curMode==='bad';
  if(isBad){
    document.getElementById('statRow').innerHTML=`
      <div class="stat bad"><div class="stat-n">15 次</div><div class="stat-l">无效循环</div></div>
      <div class="stat bad"><div class="stat-n">50K</div><div class="stat-l">Token 浪费</div></div>
      <div class="stat bad"><div class="stat-n">崩溃</div><div class="stat-l">最终结果</div></div>
    `;
    document.getElementById('ctrlLabel').textContent='看完差的 → 切换到「有脚手架」对比';
  } else {
    document.getElementById('statRow').innerHTML=`
      <div class="stat good"><div class="stat-n">5 次</div><div class="stat-l">工具调用</div></div>
      <div class="stat good"><div class="stat-n">8K</div><div class="stat-l">Token 消耗</div></div>
      <div class="stat good"><div class="stat-n">成功</div><div class="stat-l">任务完成</div></div>
    `;
    document.getElementById('ctrlLabel').textContent='脚手架让 Agent 从崩溃变成稳定交付';
  }
}

const CAP_DETAILS=[
  {title:'超时与重试',body:'<p>工具调用设置超时（如 10s），失败后用<b>指数退避</b>最多重试 3 次。超出则用降级策略：返回缓存结果或告知用户「暂时不可用」。</p><p><b>不要无限等待</b>，用户会以为 AI 卡死了。左侧「无脚手架」演示中 45 秒的等待就是反面案例。</p>'},
  {title:'最大步数限制',body:'<p>设置 <code>max_iterations=20</code>，防止 Agent 陷入死循环。</p><p>LLM 有时会反复调用同一个工具而不知道退出，左侧演示中「循环 15 次同一错误」就是本例场景。到达上限时，<b>优雅地返回当前进度</b>，直接报错是下策。</p>'},
  {title:'输入输出校验',body:'<p>用 JSON Schema 严格定义每个工具的参数类型和取值范围。</p><p>左侧演示中模型传了 <code>"明天"</code>，正确格式是 <code>"2026-04-15"</code>。有脚手架时在执行前就拦截并<b>返回格式化错误让模型自我纠正</b>，一次纠正就成功。没有校验则陷入死循环。</p>'},
  {title:'状态机 + 回滚',body:'<p>Agent 每步状态（当前步骤、已调用工具、中间结果）都持久化。某步失败时，从<b>最近检查点恢复</b>，不用从头来。</p><p>对 10+ 步的长链路 Agent 尤为重要：机票已查好，酒店失败时只重试酒店，不用重新查机票。</p>'},
  {title:'观测与日志',body:'<p>每次工具调用（输入/输出）、每次模型返回都记录完整日志，包含时间戳、Token 消耗、延迟。</p><p><b>日志为排查生产问题提供证据。</b>没有日志的 Agent 是黑盒，问题无从定位。可根据任务需要接入追踪与监控。</p>'}
];

function showCap(btn,i){
  document.querySelectorAll('.cap-item').forEach((b,j)=>b.classList.toggle('active',j===i));
  const d=CAP_DETAILS[i];
  document.getElementById('detailCard').innerHTML=`<h5>${d.title}</h5>${d.body}`;
}

resetSim();
showCap(document.querySelector('.cap-item.active'),0);

lessonOnView(document.getElementById('scafDemo'), function(){
  viewed=true;
  startPlay();
}, 0.2);


// Keep original card interactions available to keyboard users, including cards rendered after initialization.
(function() {
  function enhance() {
    document.querySelectorAll('div[onclick]').forEach(function(card) {
      if (card.dataset.keyboardReady) return;
      card.dataset.keyboardReady = 'true'; card.setAttribute('role','button'); card.tabIndex = 0;
      // The shared embed handles keyboard activation once at document level.
    });
  }
  enhance();
  new MutationObserver(enhance).observe(document.body, {childList:true,subtree:true});
})();
</script>
</body>
</html>
