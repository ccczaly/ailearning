spring.application.name=ailearning-server
server.port=${SERVER_PORT:8080}

# Configure these environment variables before starting the application.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ailearning?connectionTimeZone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:ailearning_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Only expose aggregate health; database details stay private.
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=none
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
