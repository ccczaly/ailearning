spring.application.name=ailearning-server
server.port=${SERVER_PORT:8080}

# Configure these environment variables before starting the application.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ailearning?connectionTimeZone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:ailearning_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Only expose aggregate health; database details stay private.
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=none
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}

# Only the backend loads this key. AI can be disabled without affecting login/reading.
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.model=${DEEPSEEK_MODEL:deepseek-flash}
spring.ai.deepseek.chat.max-tokens=${AI_MAX_TOKENS:512}
spring.ai.deepseek.chat.thinking.type=disabled
spring.ai.deepseek.chat.temperature=0.5
# Paid model requests are never retried automatically.
spring.ai.retry.max-attempts=1
app.ai.max-context-chars=${AI_MAX_CONTEXT_CHARS:6000}
app.ai.max-message-chars=${AI_MAX_MESSAGE_CHARS:1000}
app.ai.max-history-messages=${AI_MAX_HISTORY_MESSAGES:4}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
